plugins {
    id 'java-library'
}

group 'com.coderevolt'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

dependencies {
}

test {
    useJUnitPlatform()
}